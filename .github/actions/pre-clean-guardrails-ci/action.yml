name: Pre-clean Guardrails CI deployment
description: |
  Removes existing Guardrails deployments and writes a fresh config.json
  with new LAW and Key Vault names for the next deployment. Tries to purge
  previous soft-deleted CI vaults without waiting to reuse their names.

  Teardown uses Remove-GSAExistingDeployment -all, which removes the CI
  resource group (static name) and any other Guardrails deployment in the
  subscription found by its Solution tag, such as a manual installation,
  together with their Lighthouse delegation and Defender for Cloud role
  assignments. Without this, a manual installation's leftovers fail the
  installer's prerequisite checks even when the CI resource group is gone.

  Updates select the existing vault without removing resources.
  Storage, AA, and RG names still use the same static uniqueNameSuffix.

  LAW uses a run-specific prefix (r<GITHUB_RUN_NUMBER>). Key Vault uses a
  workflow marker, run number and attempt (for example, r85a2) so retries
  also receive a new name. Tag workflows use t to distinguish their run counter.

  The previous LAW is discovered at runtime by listing workspaces in the
  existing resource group — no external state tracking is required.

  Requires a prior azure/login@v2 step in the calling job.

inputs:
  subscription-id:
    required: true
    description: Azure subscription ID used for the Guardrails deployment.
  suffix-environment-variable-name:
    required: true
    description: |
      GITHUB_ENV variable that receives the static unique-name-suffix for use
      in subsequent steps (e.g. CI_UNIQUENAME_SUFFIX). Behaviour unchanged.
  unique-name-suffix:
    required: true
    description: |
      Static suffix appended to resource base names (e.g. the value of
      vars.UNIQUENAME_SUFFIX). Passed through to uniqueNameSuffix in config.json
      unchanged.
  update-deployment:
    required: false
    default: 'false'
    description: Select the existing Key Vault for an update and skip teardown.
  key-vault-name:
    required: true
    description: Base Key Vault name for config.json.
  key-vault-run-prefix:
    required: false
    default: 'r'
    description: 'Vault name marker: r for normal workflows, t for tag workflows.'
  resource-group:
    required: true
    description: Base resource group name for config.json.
  storage-account-name:
    required: true
    description: Base Storage Account name for config.json.
  log-analytics-workspace-name:
    required: true
    description: Base Log Analytics workspace name for config.json (without any suffix).
  automation-account-name:
    required: true
    description: Base Automation Account name for config.json.
  first-break-glass-account-upn:
    required: true
    description: First break-glass account UPN.
  second-break-glass-account-upn:
    required: true
    description: Second break-glass account UPN.
  pbmm-policy-id:
    required: true
    description: PBMM policy ID.
  allowed-location-policy-id:
    required: true
    description: Allowed location policy ID.
  allowed-location-initiative-id:
    required: true
    description: Allowed location initiative ID.
  cbs-subscription-name:
    required: true
    description: CBS subscription name.
  security-law-resource-id:
    required: true
    description: Security Log Analytics workspace resource ID.
  health-law-resource-id:
    required: true
    description: Health Log Analytics workspace resource ID.
  lighthouse-service-provider-tenant-id:
    required: true
    description: Lighthouse service provider tenant ID.
  lighthouse-principal-display-name:
    required: true
    description: Lighthouse principal display name.
  lighthouse-principal-id:
    required: true
    description: Lighthouse principal ID.
  lighthouse-target-management-group-id:
    required: true
    description: Lighthouse target management group ID.
  ssc-readonly-service-principal-appid:
    required: true
    description: SSC read-only service principal app ID.
  cloud-usage-profiles:
    required: true
    description: Cloud usage profiles value
  tenant-id:
    required: true
    description: Tenant ID.
  department-number:
    required: false
    default: '163'
    description: Department number.
  locale:
    required: false
    default: en-CA
    description: Locale.    
  security-retention-days:
    required: false
    default: '730'
    description: Security retention days.
  mfa-grace-period:
    required: false
    default: '30'
    description: MFA grace period in days (mfaGracePeriod in config.json).

runs:
  using: composite
  steps:
    - name: Pre-clean and prepare deployment suffix
      uses: azure/powershell@v2
      env:
        GSA_SUBSCRIPTION_ID:            ${{ inputs.subscription-id }}
        GSA_SUFFIX_ENV_NAME:            ${{ inputs.suffix-environment-variable-name }}
        GSA_STATIC_SUFFIX:              ${{ inputs.unique-name-suffix }}
        GSA_UPDATE_DEPLOYMENT:          ${{ inputs.update-deployment }}
        GSA_KEY_VAULT_NAME:             ${{ inputs.key-vault-name }}
        GSA_KEY_VAULT_RUN_PREFIX:       ${{ inputs.key-vault-run-prefix }}
        GSA_RESOURCE_GROUP:             ${{ inputs.resource-group }}
        GSA_STORAGE_ACCOUNT_NAME:       ${{ inputs.storage-account-name }}
        GSA_LAW_NAME:                   ${{ inputs.log-analytics-workspace-name }}
        GSA_AUTOMATION_ACCOUNT_NAME:    ${{ inputs.automation-account-name }}
        GSA_BGA1:                       ${{ inputs.first-break-glass-account-upn }}
        GSA_BGA2:                       ${{ inputs.second-break-glass-account-upn }}
        GSA_PBMM_POLICY_ID:             ${{ inputs.pbmm-policy-id }}
        GSA_ALLOWED_LOCATION_POLICY_ID: ${{ inputs.allowed-location-policy-id }}
        GSA_ALLOWED_LOCATION_INITIATIVE_ID: ${{ inputs.allowed-location-initiative-id }}
        GSA_DEPARTMENT_NUMBER:          ${{ inputs.department-number }}
        GSA_CBS_SUBSCRIPTION_NAME:      ${{ inputs.cbs-subscription-name }}
        GSA_SECURITY_LAW_RESOURCE_ID:   ${{ inputs.security-law-resource-id }}
        GSA_HEALTH_LAW_RESOURCE_ID:     ${{ inputs.health-law-resource-id }}
        GSA_LOCALE:                     ${{ inputs.locale }}
        GSA_LIGHTHOUSE_TENANT_ID:       ${{ inputs.lighthouse-service-provider-tenant-id }}
        GSA_LIGHTHOUSE_DISPLAY_NAME:    ${{ inputs.lighthouse-principal-display-name }}
        GSA_LIGHTHOUSE_PRINCIPAL_ID:    ${{ inputs.lighthouse-principal-id }}
        GSA_LIGHTHOUSE_TARGET_MG_ID:    ${{ inputs.lighthouse-target-management-group-id }}
        GSA_READONLY_SPN_APPID:         ${{ inputs.ssc-readonly-service-principal-appid }}
        GSA_SECURITY_RETENTION_DAYS:    ${{ inputs.security-retention-days }}
        GSA_CLOUD_USAGE_PROFILES:       ${{ inputs.cloud-usage-profiles }}
        GSA_TENANT_ID:                  ${{ inputs.tenant-id }}
        GSA_MFA_GRACE_PERIOD:           ${{ inputs.mfa-grace-period }}
        GSA_ACTION_REPO_ROOT:           ${{ github.action_path }}/../../..
      with:
        azPSVersion: latest
        inlineScript: |
          $ErrorActionPreference = 'Stop'

          $subscriptionId = $env:GSA_SUBSCRIPTION_ID
          $staticSuffix   = $env:GSA_STATIC_SUFFIX
          $lawBase        = $env:GSA_LAW_NAME
          $rgName         = "$($env:GSA_RESOURCE_GROUP)-$staticSuffix"
          $keyVaultBase   = $env:GSA_KEY_VAULT_NAME
          # Recognize static, earlier random, and run/attempt vault names. Accept both
          # workflow markers so normal and tag workflows can update or clean up the same
          # CI environment. Resource IDs below also restrict purge to this CI group.
          $keyVaultNamePattern = '^{0}(-([rt][0-9]+a[0-9]+|[a-f0-9]{{7}}))?-{1}$' -f [regex]::Escape($keyVaultBase), [regex]::Escape($staticSuffix)

          Set-AzContext -SubscriptionId $subscriptionId

          $existingResourceGroup = Get-AzResourceGroup -Name $rgName -ErrorAction SilentlyContinue
          $existingKeyVaults = @()
          if ($existingResourceGroup) {
            $existingKeyVaults = @(Get-AzKeyVault -ResourceGroupName $rgName -SubscriptionId $subscriptionId -ErrorAction Stop |
              Where-Object { $_.VaultName -match $keyVaultNamePattern })
          }
          $existingKeyVault = $existingKeyVaults | Select-Object -First 1
          $existingKeyVaultBase = $keyVaultBase
          if ($existingKeyVault) {
            $existingKeyVaultBase = $existingKeyVault.VaultName -replace "-$([regex]::Escape($staticSuffix))$", ''
          }

          # Updates must keep the deployed vault. Discover its actual base name;
          # the installer re-appends the static suffix. Exit before teardown or purge.
          if ($env:GSA_UPDATE_DEPLOYMENT -eq 'true') {
            if ($existingKeyVaults.Count -ne 1) {
              throw "Expected one CI Key Vault in '$rgName' for the update; found $($existingKeyVaults.Count)."
            }
            "GSA_CI_KEY_VAULT_BASE=$existingKeyVaultBase" | Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Output "Reusing CI Key Vault '$($existingKeyVault.VaultName)' for the update."
            exit
          }

          # Each workflow has its own run counter, so r/t separates normal and tag runs.
          # A rerun keeps the run number; include its attempt to avoid a name reserved
          # by the previous attempt. Check the installer and Azure limits before teardown.
          if ($env:GSA_KEY_VAULT_RUN_PREFIX -notin @('r', 't')) {
            throw "key-vault-run-prefix must be 'r' or 't'."
          }
          $newKeyVaultBase = "$keyVaultBase-$($env:GSA_KEY_VAULT_RUN_PREFIX)$($env:GITHUB_RUN_NUMBER)a$($env:GITHUB_RUN_ATTEMPT)"
          if ($newKeyVaultBase.Length -gt 15 -or "$newKeyVaultBase-$staticSuffix".Length -gt 24) {
            throw "Generated CI Key Vault name '$newKeyVaultBase-$staticSuffix' exceeds the installer or Azure name limit."
          }
          # New unique LAW prefix for this run. 'r' prefix: Azure names must start with a letter.
          $newLawSuffix   = "r$env:GITHUB_RUN_NUMBER"
          $newLawBase     = "$lawBase-$newLawSuffix"

          $actionRepoRoot = Resolve-Path $env:GSA_ACTION_REPO_ROOT | Select-Object -ExpandProperty Path
          Import-Module (Join-Path $actionRepoRoot 'src/GuardrailsSolutionAcceleratorSetup')

          # Use the old resource names during teardown and the new names for deployment.
          function New-Config([string]$lawNameForConfig, [string]$keyVaultNameForConfig) {
            return [ordered]@{
              keyVaultName                       = $keyVaultNameForConfig
              resourcegroup                      = $env:GSA_RESOURCE_GROUP
              region                             = 'CanadaCentral'
              storageaccountName                 = $env:GSA_STORAGE_ACCOUNT_NAME
              logAnalyticsworkspaceName          = $lawNameForConfig
              autoMationAccountName              = $env:GSA_AUTOMATION_ACCOUNT_NAME
              FirstBreakGlassAccountUPN          = $env:GSA_BGA1
              SecondBreakGlassAccountUPN         = $env:GSA_BGA2
              PBMMPolicyID                       = $env:GSA_PBMM_POLICY_ID
              AllowedLocationPolicyId            = $env:GSA_ALLOWED_LOCATION_POLICY_ID
              AllowedLocationInitiativeId        = $env:GSA_ALLOWED_LOCATION_INITIATIVE_ID
              DepartmentNumber                   = $env:GSA_DEPARTMENT_NUMBER
              CBSSubscriptionName                = $env:GSA_CBS_SUBSCRIPTION_NAME
              securityLAWResourceId              = $env:GSA_SECURITY_LAW_RESOURCE_ID
              healthLAWResourceId                = $env:GSA_HEALTH_LAW_RESOURCE_ID
              Locale                             = $env:GSA_LOCALE
              lighthouseServiceProviderTenantID  = $env:GSA_LIGHTHOUSE_TENANT_ID
              lighthousePrincipalDisplayName     = $env:GSA_LIGHTHOUSE_DISPLAY_NAME
              lighthousePrincipalId              = $env:GSA_LIGHTHOUSE_PRINCIPAL_ID
              lighthouseTargetManagementGroupID  = $env:GSA_LIGHTHOUSE_TARGET_MG_ID
              subscriptionId                     = $subscriptionId
              SSCReadOnlyServicePrincipalNameAPPID = $env:GSA_READONLY_SPN_APPID
              uniqueNameSuffix                   = $staticSuffix
              securityRetentionDays              = $env:GSA_SECURITY_RETENTION_DAYS
              cloudUsageProfiles                 = $env:GSA_CLOUD_USAGE_PROFILES
              tenantId                           = $env:GSA_TENANT_ID
              mfaGracePeriod                     = $env:GSA_MFA_GRACE_PERIOD
            }
          }

          $configFilePath = Join-Path $env:GITHUB_WORKSPACE 'config.json'

          # ── 1. Tear down existing deployments ────────────────────────────────────────
          # Remove-GSAExistingDeployment finds the CI RG by its static name
          # ($rgBase-$staticSuffix) and any other Guardrails deployment in the
          # subscription by its Solution tag (for example one installed manually with
          # different names), then removes the Lighthouse delegation, Defender for Cloud
          # role assignments and the resource group for each. Those leftovers otherwise
          # fail the installer's prerequisite checks even when the CI RG itself is gone,
          # so this runs on every fresh deployment rather than only when the CI RG exists.
          #
          # The config written here is the fallback description of the CI RG for when
          # its exported configuration cannot be read; each deployment's exported
          # configuration (gsaConfigExportLatest) is preferred when available. It
          # carries the NEW vault base: Remove-GSAExistingDeployment purges a deleted
          # vault only when the next deployment reuses its name, and CI vault names
          # change every run. The CI-specific purge loop below handles old vaults.
          if ($existingResourceGroup) {
            # Find the existing LAW whose name starts with the base name pattern.
            $existingLAW = Get-AzOperationalInsightsWorkspace -ResourceGroupName $rgName `
              -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -like "$lawBase-*" } |
              Select-Object -First 1

            if ($existingLAW) {
              # Strip the static suffix from the full LAW name to recover the base
              # (e.g. "logcac-r141-abc123" → "logcac-r141") so Confirm-GSAConfigurationParameters
              # can re-append "-$staticSuffix" and arrive at the correct full name.
              $existingLAWBase = $existingLAW.Name -replace "-$([regex]::Escape($staticSuffix))$", ''
              Write-Output "Found existing LAW '$($existingLAW.Name)' (base: '$existingLAWBase')."
            }
            else {
              # No run-specific LAW found — fall back to the bare base name so
              # Remove-GSACoreResources can still clean up the rest of the RG.
              $existingLAWBase = $lawBase
              Write-Output "No existing LAW matching '$lawBase-*' found in '$rgName'. Using bare base name for teardown."
            }
          }
          else {
            $existingLAWBase = $lawBase
            Write-Output "RG '$rgName' not found. Still checking the subscription for other Guardrails deployments (for example a manual installation)."
          }

          New-Config $existingLAWBase $newKeyVaultBase | ConvertTo-Json -Depth 5 | Set-Content -Path $configFilePath

          Push-Location -Path (Join-Path $actionRepoRoot 'setup')
          try {
            # -all: remove every discovered deployment, not just one. The CI subscription may
            # hold both the previous pipeline deployment and a manual installation.
            Remove-GSAExistingDeployment -configFilePath $configFilePath -newComponents CoreComponents, CentralizedCustomerReportingSupport -all -Force
          }
          finally { Pop-Location }

          # Purge only deleted vaults whose original resource ID is in this CI group and
          # whose name matches the CI naming pattern. Include leftovers from earlier
          # attempts even when the group was already gone. Cleanup failures are visible
          # but do not block a fresh name; the installer checks that new name separately.
          $keyVaultResourceIdPrefix = "/subscriptions/$subscriptionId/resourceGroups/$rgName/providers/Microsoft.KeyVault/vaults/"
          try {
            $deletedKeyVaults = @(Get-AzKeyVault -InRemovedState -SubscriptionId $subscriptionId -ErrorAction Stop |
              Where-Object {
                $_.VaultName -match $keyVaultNamePattern -and
                $_.ResourceId -ieq "$keyVaultResourceIdPrefix$($_.VaultName)"
              })
            if ($existingKeyVault -and $existingKeyVault.VaultName -notin $deletedKeyVaults.VaultName) {
              Write-Warning "Previous CI Key Vault '$($existingKeyVault.VaultName)' is not yet visible as deleted. Continuing with a new vault name; later fresh runs will try cleanup again."
            }
            elseif ($deletedKeyVaults.Count -eq 0) {
              Write-Output "No deleted CI Key Vaults to purge for '$rgName'. Continuing with a new vault name."
            }
            foreach ($deletedKeyVault in $deletedKeyVaults) {
              try {
                Write-Output "Purging soft-deleted CI Key Vault '$($deletedKeyVault.VaultName)' in '$($deletedKeyVault.Location)'."
                Remove-AzKeyVault -VaultName $deletedKeyVault.VaultName -Location $deletedKeyVault.Location `
                  -SubscriptionId $subscriptionId -InRemovedState -Force -ErrorAction Stop
              }
              catch {
                Write-Warning "Could not purge CI Key Vault '$($deletedKeyVault.VaultName)'. Check purge permissions and purge protection. Continuing with a new vault name. $_"
              }
            }
          }
          catch {
            Write-Warning "Could not list deleted CI Key Vaults for cleanup. Continuing with a new vault name. $_"
          }

          # ── 2. Write config.json for the new deployment ──────────────────────────────
          # logAnalyticsworkspaceName = "$lawBase-r<run>" so Confirm-GSAConfigurationParameters
          # appends "-$staticSuffix" to produce a fully unique name each run
          # (e.g. "logcac-r142-abc123"). The generated vault base also keeps the static suffix.
          New-Config $newLawBase $newKeyVaultBase | ConvertTo-Json -Depth 5 | Set-Content -Path $configFilePath
          Write-Output "config.json written (new LAW base: '$newLawBase', new Key Vault base: '$newKeyVaultBase', static suffix: '$staticSuffix')."

          # Expose to subsequent steps:
          #   CI_UNIQUENAME_SUFFIX — static suffix, unchanged; deploy step uses for uniqueNameSuffix
          #   GSA_LAW_RUN_SUFFIX   — run-specific LAW prefix; deploy step uses for logAnalyticsworkspaceName
          #   GSA_CI_KEY_VAULT_BASE — selected vault base for deployment and job validation
          "$($env:GSA_SUFFIX_ENV_NAME)=$staticSuffix" | Out-File -FilePath $env:GITHUB_ENV -Append
          "GSA_LAW_RUN_SUFFIX=$newLawSuffix"          | Out-File -FilePath $env:GITHUB_ENV -Append
          "GSA_CI_KEY_VAULT_BASE=$newKeyVaultBase"     | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Output "Deployment suffix: '$staticSuffix'  LAW run suffix: '$newLawSuffix'."